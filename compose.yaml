services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      SNAPVAULT_STAGING_DIR: /staging
      SNAPVAULT_WEB_ORIGIN: http://localhost:8080
      SNAPVAULT_SECRET_KEY: ${SNAPVAULT_SECRET_KEY:-local-dev-secret}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SNAPVAULT_DB: snapvault
    volumes:
      - snapvault-data:/data
      - snapvault-staging:/staging
      - ./tmp/rclone:/config/rclone
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    # A MinIO parou de publicar a edicao community no Docker Hub e no quay.io em 2025/2026
    # (ambos retornam "unauthorized" para qualquer tag). cgr.dev/chainguard/minio e o
    # substituto gratuito e publico recomendado pela propria comunidade.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    # Imagem distroless da Chainguard nao tem curl/wget/shell para um healthcheck via CMD;
    # minio e so uma Source de demonstracao, entao api so espera o container iniciar.

volumes:
  snapvault-data:
  snapvault-staging:
  pg-data:
  minio-data:
